name: Release
# Push a tag such as v0.1.0 to build the game for Linux, Windows and macOS and publish a GitHub release.
# "Run workflow" on a branch builds the same packages as downloadable artifacts without publishing.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

env:
  GODOT_VERSION: "4.7.2"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - run: dotnet test -c Release

  export:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        platform: [linux, windows, macos]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - id: godot
        uses: ./.github/actions/setup-godot
        with:
          version: ${{ env.GODOT_VERSION }}
          templates: "true"
      - name: Work out the version
        id: version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then v="${GITHUB_REF_NAME#v}"; else v="dev-${GITHUB_SHA::7}"; fi
          echo "value=$v" >> "$GITHUB_OUTPUT"
      - name: Export ${{ matrix.platform }}
        env:
          GODOT: ${{ steps.godot.outputs.godot }}
        run: bash scripts/export.sh ${{ matrix.platform }} ${{ steps.version.outputs.value }}
      - uses: actions/upload-artifact@v4
        with:
          name: OpenPolitics-${{ matrix.platform }}
          path: build/OpenPolitics-*
          if-no-files-found: error

  publish:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: export
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/OpenPolitics-* \
            --title "OpenPolitics ${GITHUB_REF_NAME#v}" \
            --generate-notes \
            --notes-file .github/release-notes.md \
            --verify-tag
