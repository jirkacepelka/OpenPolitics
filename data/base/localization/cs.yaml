ui.explain.capital: "Politický kapitál platí akce strany a, pokud vedete vládu, i změny politik. Příjem za čtvrtletí: {0} + {1} × organizace × podíl v průzkumu, +{2} pro vedoucí stranu úřadující vlády a až ±{3} z koalice (vedoucí: průměrná loajalita partnerů; partner: váš vztah s vedoucí stranou). Víc než {4} mít nelze."
ui.explain.organisation: "Jak dobře je strana zorganizovaná (0–100 %). Zvyšuje příjem kapitálu ({0} × organizace × podíl v průzkumu za čtvrtletí) a účast vašich voličů (až +{1} % při plné organizaci). Organizovat: +{2} bodů za {3} kapitálu. Každé čtvrtletí klesne o {4} bod."
ui.explain.credibility: "Jak moc voliči věří vašemu programu (0–100 %). Spolu se soudržností určuje, jak silně vaše postoje přitahují voliče (závisí na ní polovina té přitažlivosti). Obnovuje se o {0} bodů ročně. Klesá, když posunete postoj (až o {1} bodů při posunu přes celý rozsah), změníte prioritu, porušíte slib ve vládě (−{2}), odejdete z koalice (−{3}), prohrajete hlasování o nedůvěře, odpovíte nebo ohlásíte něco proti programu, nebo získáte vinu za schodek. Splněný slib ve vládě přinese +{4}."
ui.explain.cohesion: "Jak jednotné jsou vaše frakce za programem (0–100 %): jedna minus jejich průměrná vzdálenost od něj. Voliči vidí důvěryhodnost × soudržnost, takže rozpolcená strana přitahuje méně. Mění se jen posunem postojů, na kterých frakcím záleží."
ui.explain.relations: "Jak vás vidí ostatní strany (0–1, neutrální {0}). Dobré vztahy snižují cenu, kterou si strana řekne při koaličních jednáních (až o polovinu), dělají z vás žádanějšího partnera, pomáhají vašim návrhům u vedoucí strany, rozhodují, kdo podpoří vaše hlasování o nedůvěře (od 0,4), a jako partnerovi přinášejí až ±{1} kapitálu za čtvrtletí. Získávat stranu: +{2} za {3} kapitálu. Vztahy se vracejí k {0} o {4} za čtvrtletí."
ui.explain.fiscal_blame: "Jak moc vás voliči viní ze schodku. Když schodek roste, vedoucí strana vlády získá {0} bod viny za každý bod HDP a každý partner {1}; když pod vládou klesá, její strany vinu ztrácejí stejným tempem. Vina se každých {2} čtvrtletí zmenší na polovinu. Každý bod stojí přízeň voličů ({3} v průzkumu, nejvýš {4}) a při získání {5} důvěryhodnosti. V opozici ji nezískáváte ani neztrácíte: kdo schodek způsobil, platí dál, kdo ho uklízí, žádnou vinu nenese."
ui.explain.campaign: "Kampaň: {0} kapitálu za stupeň (1–3). Zvolená skupina voličů se k vám přikloní o {1} za stupeň, v posledních {2} čtvrtletích před volbami dvojnásobně. Přízeň se každá {3} čtvrtletí zmenší na polovinu."
ui.explain.organise: "Organizovat: {0} kapitálu za +{1} bodů organizace (vyšší příjem kapitálu a účast; organizace klesá o {2} bod za čtvrtletí)."
ui.explain.court: "Získávat stranu: {0} kapitálu, vztah +{1} (vrací se k neutrální hodnotě)."
ui.explain.criticize: "Kritizovat (ne jako vedoucí strana): {0} kapitálu. Skupiny, kterým na hodnotě záleží a viděly ji za poslední čtyři čtvrtletí zhoršit, se k vám přikloní (+{1}) a viní vládu (tlak +{2}); pokud se zlepšila, obrátí se to proti vám (−{3})."
ui.explain.stance: "Postoj k vládnímu opatření (ne jako vedoucí strana): {0} kapitálu; každá skupina, které se váš postoj líbí, se přikloní až o {1} (podle velikosti), ostatní ochladnou."
ui.explain.promise: "Slib (v posledních {0} čtvrtletích před volbami, nejvýš {1}): {2} kapitálu; vaše skupiny voličů se přikloní až o {3}. Platí do příštích voleb a posoudí se v nich: pokud jste aspoň polovinu té doby vládli, splněný +{4} důvěryhodnosti, porušený −{5}; z opozice nic."
ui.explain.priority: "Priorita: {0} kapitálu, ±{1} váhy naráz; důvěryhodnost klesne o {2} × změnu. Vyšší váha znamená, že postoj víc váží u voličů i při koaličních jednáních."
ui.explain.shift: "Posunout postoj: {0} kapitálu, nejvýš o {1} % rozsahu naráz; důvěryhodnost klesne o {2} × posun vůči rozsahu."
ui.explain.propose: "Navrhnout vedoucí straně (jako partner): {0} kapitálu; vedoucí strana souhlasí podle vašeho vztahu, vašeho podílu na mandátech vlády a souladu s vlastním programem."
ui.explain.announce: "Ohlásit návrh (ne jako vedoucí strana): {0} kapitálu, jednou za čtvrtletí, stejnou politiku znovu po {1} čtvrtletích. Skupiny, kterým by se líbil, se přikloní až o {2}, ostatní ochladnou; proti vašemu programu stojí až {3} důvěryhodnosti. Vláda vedená jinou stranou populární návrh převezme s pravděpodobností {4} %."
ui.explain.proposals: "Návrhy v přehledu: zdarma. Odpověď v souladu s programem přinese až {0} důvěryhodnosti, proti němu stojí až {1}; podpora +{2} ke vztahu s předkladatelem, odmítnutí −{3} (partner proti vlastní vládě o {4} víc); skupiny voličů reagují až o {5}. Ne rozhodujícího partnera opatření zablokuje (vztah −{6}). Nejvýš jeden za {7} čtvrtletí; bez odpovědi opatření projde a žádost propadne."
ui.explain.reshuffle: "Přestavba koalice (vedoucí strana): {0} + {1} kapitálu za každou odebranou či přidanou stranu; další po {2} čtvrtletích ({3} po odmítnutí)."
ui.explain.exits: "Nedůvěra (opozice): {0} kapitálu; projde s dostatkem ochotných stran (vztah aspoň 0,4) a nespokojených partnerů. Odvolat partnera (vedoucí strana): {1} kapitálu, pokud zbytek udrží většinu. Odejít z koalice (partner): zdarma, −{2} důvěryhodnosti."
ui.help.proposal: "Odpovězte: support  nebo  oppose  (zdarma; před koncem čtvrtletí)"
ui.err.usage_announce: "Použití: announce POLITIKA HODNOTA  (např. announce duchody 11)"
