name.base:poverty_load: "Lidé odkázaní na podporu"
desc.base:poverty_load: "Chudé domácnosti a domácnosti s nízkým příjmem. Podle toho rostou náklady na dávky a bydlení."
name.base:labour_supply_growth: "Růst pracující populace"
