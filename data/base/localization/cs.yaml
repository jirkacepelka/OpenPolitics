ui.explain.ultimatum: "Jako menší partner můžete vedoucí straně vzkázat: splňte tohle, nebo odejdeme. Vyberte jeden ze svých požadavků (cíl se žádá jako posun politiky, která ho ovlivňuje nejvíc) nebo pozici z programu (nejvýš o {4} rozsahu politiky směrem k ní) a lhůtu {1}–{2} čtvrtletí. Stojí {0} kapitálu; jen jedno najednou, pak pauza {3} čtvrtletí. Vedoucí strana odpoví na konci čtvrtletí: ustoupí, otálí (může ustoupit, jak se lhůta blíží) nebo odmítne. Váží vztah, jak blízko je změna jejímu programu, zda může vládnout nebo najít náhradu bez vás, vaši váhu ve vládě, velikost změny a případnou zášť. Splněno: +{5} důvěryhodnosti a přízeň vašich voličů, vedoucí strana vás má o něco méně ráda. Nesplněno do lhůty: vaše strana odejde z vlády ({6} důvěryhodnosti místo {8} za neohlášený odchod; vedoucí strana to nese nelibě; bez vašich mandátů může vláda padnout). Stažení stojí {7} důvěryhodnosti."
