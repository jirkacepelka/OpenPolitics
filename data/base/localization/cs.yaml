ui.explain.fiscal_credit: "Protějšek viny za schodek, záměrně menší. Když vláda sníží skutečný schodek (pokles schodku nad vyrovnaným rozpočtem, aspoň {7} bodu za čtvrtletí), její strany získají fiskální zásluhu: {0} × snížení × stejná závažnost jako u viny (1 + schodek / 3), takže snížení vysokého schodku váží víc; vedoucí strana celou, každý partner {1}. Vaše strana dostane {2} politického kapitálu za bod zásluhy (nejvýš {3} za čtvrtletí), trochu důvěryhodnosti a přízeň v průzkumu ({4} za bod, nejvýš {5}); zásluha se každých {6} čtvrtletí zmenší na polovinu. Přebytek, který jen zůstává přebytkem, nic nepřinese a opozice nezíská nic."
