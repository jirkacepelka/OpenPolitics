ui.help.body: "Enter            ukončí čtvrtletí a ukáže, co se stalo\nset N HODNOTA    změní politiku číslo N, např.  set 1 26   (účinek trvá pár čtvrtletí; stojí politický kapitál)\nlist             ukáže vaše politiky         voters   ukáže, jak se cítí skupiny voličů\nvalues           vypíše vše, co země měří\nwhy NÁZEV        vysvětlí, co hýbalo hodnotou, např.  why nezaměstnanost\ninfo NÁZEV       vysvětlí politiku nebo hodnotu lidsky\nsave SOUBOR / load SOUBOR    uloží nebo obnoví hru\nquit             opustí hru\nNÁZEV může být číslo, začátek názvu nebo id.\nVýdaje mohou sledovat HDP, inflaci nebo nic: index N gdp|inflation|none\nNávrh politiky (ne jako vedoucí): propose POLITIKA HODNOTA (partner ho posílá vedoucí straně, jinak je veřejný; 'announce' je totéž)\nVe vládě: leave  dismiss STRANA  reshuffle drop STRANA add STRANA (vedoucí)  confidence (opozice)\nSestavování vlády: coalition  auto  invite STRANA  agree STRANA N  submit  accept  reject  early\nPriority a sliby: priority POLITIKA VÁHA   promise N (před volbami: co uděláte v příštím období, posoudí se ve volbách po něm)\nNávrhy pro vás: support / oppose otevřený návrh\nUltimátum (menší partner): ultimatum [zkus] pozadavek N [ČTVRTLETÍ] nebo ultimatum [zkus] program POLITIKA [ČTVRTLETÍ]; stahni\nKoaliční jednání (sestavovatel): jednani  jednani poslat  jednani protinavrh  protinavrh STRANA N HODNOTA|napul|off  resort STRANA RESORT  ustupek STRANA 0-2; pozvaná strana: protinavrh N [RESORT]"
