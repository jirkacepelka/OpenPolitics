desc.base:debt: "Kolik stát dluží, v korunách ve stálých cenách (nominálně v Kč, ne v % HDP – podíl na HDP ukazuje horní lišta a graf „Dluh (% HDP)“). Úroky ukrajují z rozpočtu a při vysokém dluhu si věřitelé účtují víc. Dluh nemůže klesnout pod nulu: přebytek ho nejdřív splácí, pak se hromadí ve státní rezervě."
desc.base:interest_rate: "Kolik stát platí za půjčky. S dluhem roste."
desc.base:revenue: "Daně a odvody, které stát za rok vybere."
desc.base:spending: "Co stát za rok utratí za důchody, zdraví, školy a další."
desc.base:price_level: "Index spotřebitelských cen, na začátku 100. Roste s inflací."
desc.base:gdp_nominal: "HDP v běžných cenách: reálné HDP krát cenová hladina."
desc.base:real_growth: "Jak rychle roste ekonomika za rok po odečtení inflace."
desc.base:deficit_pct: "Výdaje plus úroky minus příjmy jako podíl HDP. Záporné číslo je přebytek."
desc.base:health: "Celkové zdraví obyvatel."
desc.base:education_level: "Jak vzdělaní lidé jsou. Roste pomalu."
desc.base:crime: "Evidované trestné činy na 100 tisíc obyvatel za rok."
desc.base:environment: "Kvalita vzduchu, vody a přírody. Růst ji spíš zhoršuje, regulace pomáhá."
desc.base:inequality: "Jak nerovně jsou rozdělené příjmy (Giniho index, vyšší znamená nerovnější)."
desc.base:income_tax: "Daň z příjmu a odvody (sazba). Víc peněz pro stát, ale zatěžuje práci a růst."
desc.base:vat: "DPH a spotřební daně (sazba). Snadno se vybírají; zvyšují ceny a dopadají na chudší."
desc.base:corporate_tax: "Daň z příjmů firem (sazba). Příliš vysoká odrazuje investice."
desc.base:pensions: "Výdaje na důchody (roční částka). Senioři je milují; stojí hodně."
