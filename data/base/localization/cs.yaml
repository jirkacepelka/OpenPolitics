desc.base:defence: "Mimořádné výdaje na obranu (roční částka) (nad základ ve správě státu). Malé přínosy pro bezpečnost a technologie."
desc.base:culture_sport: "Divadla, muzea a sportovní kluby (roční částka). Zdravější a vzdělanější lidé."
desc.base:public_transport: "Dotace vlaků, tramvají a autobusů (roční částka). Čistší vzduch a snazší dojíždění."
desc.base:housing_support: "Příspěvky na nájem a obecní byty (roční částka). Snižuje nerovnost."
desc.base:family_allowances: "Peníze rodinám s dětmi (roční částka). Méně chudých rodin a později o něco větší pracovní síla."
desc.base:active_labour_policy: "Rekvalifikace a zprostředkování práce (roční částka). Snižuje nezaměstnanost."
desc.base:rural_development: "Podpora vsí a farem (roční částka). Práce a spravedlnost mimo města."
desc.base:green_subsidies: "Zateplení, solární panely a čistý průmysl (roční částka). Zlepšuje prostředí, lehce zvyšuje ceny."
desc.base:digital_infrastructure: "Rychlý internet a online služby státu (roční částka). Dlouhodobě zvyšuje produktivitu."
desc.base:childcare: "Jesle a školky (roční částka). Rodiče mohou pracovat a děti se učí dříve."
desc.base:property_tax: "Daň z pozemků a staveb (sazba). Těžko se obchází, mírně snižuje nerovnost."
desc.base:carbon_tax: "Daň z emisí (sazba). Čistší příroda, vyšší ceny, zátěž pro průmysl."
desc.base:wealth_tax: "Daň z velkých majetků (sazba). Snižuje nerovnost, ale odhání kapitál."
desc.base:transaction_tax: "Malá daň z obchodování na trzích (sazba). Vynáší peníze, investoři ji nemají rádi."
desc.base:excise_taxes: "Přirážky na tabák, alkohol a cukr (sazba). Zdravější lidé, vyšší ceny."
desc.base:minimum_wage: "Jak vysoká je zákonná minimální mzda (0 až 10). Pomáhá nejchudším, může stát práci a zvyšuje ceny."
desc.base:labour_flexibility: "Jak snadné je přijímat a propouštět (0 až 10). Více práce a produktivity, méně jistot."
desc.base:rent_control: "Jak přísně jsou nájmy zastropovány (0 až 10). Chrání nájemníky, odrazuje od stavění."
desc.base:drug_policy: "Jak liberální jsou drogové zákony (0 až 10). Odlehčí soudům a pomůže závislým, ale kriminalita může mírně stoupnout."
desc.base:university_fees: "Jak vysoké je školné (0 až 10). Šetří veřejné peníze, ale odrazuje chudší studenty."
desc.base:retirement_age: "Věk odchodu do důchodu (roky). Pozdější odchod znamená více pracujících a těžší stáří."
desc.base:energy_mix: "Jak zelená je výroba energie (0 až 10). Čistší vzduch, dražší energie."
desc.base:business_regulation: "Kolik byrokracie čeká firmy (0 až 10). Chrání spotřebitele a zaměstnance, brzdí investice."
desc.base:surveillance: "Kolik smí stát sledovat občany (0 až 10). Méně nevyřešených zločinů, méně svobod."

