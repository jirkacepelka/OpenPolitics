name.base:fertility: "Porodnost (dětí na ženu)"
desc.base:fertility: "Počet narozených dětí na ženu. Zvyšuje ji podpora rodin, péče o děti a bydlení, snižuje nejistota."
name.base:life_expectancy: "Naděje dožití"
desc.base:life_expectancy: "Kolik let se může novorozenec dožít. Zvyšuje ji zdravotnictví a čistější prostředí."
name.base:net_migration: "Čistá migrace (na 1000)"
