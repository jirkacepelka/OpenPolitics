desc.base:inheritance_tax: "Daň z velkých dědictví, sazba. Zmenšuje nerovnost; bohatí vyvádějí majetek do zahraničí."
desc.base:sugar_tax: "Příplatek na slazené nápoje a pamlsky, sazba. Zdravější strava, mírně vyšší ceny."
desc.base:digital_services_tax: "Daň z obratu velkých online platforem, sazba. Přináší peníze; platformy část přenesou na zákazníky."
desc.base:bank_levy: "Roční odvod z bilance bank, sazba. Snadno se vybírá; úvěry jsou dražší."
desc.base:windfall_tax: "Příplatek pro firmy s mimořádnými zisky, sazba. Financuje pomoc v těžkých časech; investoři se lekají."
desc.base:vehicle_tax: "Roční daň z aut podle velikosti a emisí, sazba. Čistší vzduch; nejvíc platí řidiči na venkově."
desc.base:elderly_care: "Domácí a pobytová péče, roční částka. Zdravější a jistější stáří."
desc.base:disability_support: "Příspěvky a asistence, roční částka. Méně lidí padá do chudoby."
desc.base:mental_health: "Ambulance a prevence, roční částka. Lepší zdraví, o něco méně zločinu."
desc.base:vocational_training: "Učňovství a rekvalifikace, roční částka. Méně nezaměstnaných, zručnější pracovní síla."
desc.base:school_meals: "Obědy zdarma pro žáky, roční částka. Zdravější a najedení žáci se učí lépe."
desc.base:scholarships: "Granty pro nadané a chudší studenty, roční částka. Více vzdělaných lidí z každého prostředí."
desc.base:rail_network: "Nové tratě a moderní vlaky, roční částka. Čistší doprava a produktivnější ekonomika, pomalu."
desc.base:flood_protection: "Hráze, retenční plochy a varovné systémy, roční částka. Chrání krajinu i majetek."
desc.base:nuclear_programme: "Nové reaktory, roční částka. Dlouhodobě čistá a levná energie."
desc.base:cybersecurity: "Ochrana sítí a veřejných služeb, roční částka. Méně výpadků a podvodů."
desc.base:justice_system: "Více soudců a rychlejší řízení, roční částka. Méně zločinu, pevnější smlouvy."
desc.base:prisons_and_rehabilitation: "Vězeňská místa a programy pro propouštěné, roční částka. Méně recidivy."
desc.base:border_guard: "Pohraniční policie a kontroly, roční částka. Méně pašeráků a nelegálních přechodů."
desc.base:startup_support: "Startovací granty a levné úvěry, roční částka. Nové firmy, nová místa, produktivnější ekonomika."
desc.base:agriculture_subsidies: "Platby zemědělcům, roční částka. Udrží farmy a levné potraviny; zatěžuje přírodu."
desc.base:regional_funds: "Peníze pro chudší regiony, roční částka. Práce a služby tam, kde chybí."
desc.base:foreign_aid: "Pomoc chudším zemím, roční částka. Stabilnější okolní svět."
desc.base:public_housing: "Obecní byty stavěné a pronajímané levně, roční částka. Nižší náklady na bydlení pro chudé."
desc.base:gun_laws: "Jak přísně se kontrolují zbraně (0 až 10). Méně střelby; myslivci a sportovní střelci odmítají."
desc.base:data_protection: "Jak přísně se chrání osobní údaje (0 až 10). Víc soukromí; policie a firmy mají méně podkladů."
desc.base:press_freedom: "Jak svobodná a nezávislá jsou média (0 až 10). Kontrola moci; vyhrocenější veřejná debata."
desc.base:abortion_access: "Jak snadný je legální potrat (0 až 10). Hluboce rozdělující téma."
desc.base:same_sex_unions: "Jak daleko zákon uznává páry stejného pohlaví (0 až 10). Rovná práva; konzervativci odmítají."
desc.base:euthanasia: "Jak volně se člověk smí rozhodnout pro asistované umírání (0 až 10). Důstojnost proti povinnosti chránit život."
desc.base:smoking_ban: "Jak široce je zakázáno kouření na veřejnosti (0 až 10). Zdravější plíce; kuřáci a hospodští reptají."
desc.base:alcohol_policy: "Jak přísně se alkohol prodává a propaguje (0 až 10). Méně pití, méně násilí."
desc.base:vaccination_policy: "Jak silně se očkování prosazuje (0 až 10). Chrání zdraví; někteří nesou nelibě, že jim to někdo nařizuje."
desc.base:curriculum_reform: "Jak moderní a zaměřené na dovednosti jsou osnovy (0 až 10). Lépe připravení žáci, učitelé se musejí přeškolit."
desc.base:paid_leave: "Jak štědrá je dovolená a nemocenská (0 až 10). Odpočatí a zdravější zaměstnanci; platí zaměstnavatelé."
desc.base:union_rights: "Jak silné jsou odbory při vyjednávání (0 až 10). Lepší mzdy a menší nerovnost; méně pružnosti."
desc.base:foreign_investment_screening: "Jak těžké je pro cizince koupit strategické firmy (0 až 10). Bezpečnost; méně kapitálu."
desc.base:competition_policy: "Jak tvrdě stát jedná proti kartelům a monopolům (0 až 10). Nižší ceny, schopnější firmy."
desc.base:procurement_transparency: "Jak otevřeně stát nakupuje (0 až 10). Méně zmanipulovaných zakázek; pomalejší nákupy."
desc.base:anti_corruption: "Jak tvrdě se stíhá korupce (0 až 10). Poctivá správa, levnější investice; mocní se brání."
desc.base:judicial_independence: "Jak nezávislí na politicích jsou soudci (0 až 10). Předvídatelné právo; menší politická kontrola."
desc.base:citizenship_rules: "Jak snadné je získat občanství (0 až 10). Integrace a pracovníci; vypjatá debata."
desc.base:asylum_policy: "Jak štědře se uděluje azyl (0 až 10). Lidské; zkouší trpělivost veřejnosti."
desc.base:zoning_planning: "Jak snadné je získat povolení ke stavbě (0 až 10). Více domů a investic; méně zeleně."
desc.base:gmo_policy: "Jak volně se smějí pěstovat geneticky upravené plodiny (0 až 10). Vyšší výnosy; nedůvěra veřejnosti."

