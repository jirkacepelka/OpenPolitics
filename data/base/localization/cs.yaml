name.base:unemployed: "Nezaměstnaní"
desc.base:unemployed: "Lidé hledající práci."
name.base:entrepreneurs: "Podnikatelé"
desc.base:entrepreneurs: "Majitelé firem a OSVČ."
name.base:public_sector: "Zaměstnanci veřejného sektoru"
desc.base:public_sector: "Učitelé, zdravotní sestry, úředníci."
name.base:pension_subsidy: "Soukromé penze: příspěvek státu"
desc.base:pension_subsidy: "Stát přidává k tomu, co si lidé spoří na stáří (procenta HDP). Víc lidí spoří; rozpočet platí hned, důchody se zlehčí později."
name.base:pension_tax_relief: "Soukromé penze: daňová úleva"
desc.base:pension_tax_relief: "Spoření na stáří se odečítá z daní (ušlé příjmy, procenta HDP). Spoření se vyplatí."
name.base:mandatory_pension_pillar: "Povinný penzijní pilíř"
desc.base:mandatory_pension_pillar: "Část sociálních odvodů jde do soukromých fondů (procenta HDP). Silný dlouhodobý efekt; stát o peníze léta přichází a přitom platí dnešní důchodce."

