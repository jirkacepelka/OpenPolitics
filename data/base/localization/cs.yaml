ui.client.welcome: "Vítejte. Vládnete zemi: v záložce Politiky nastavujete daně, výdaje a pravidla, tlačítkem Ukončit čtvrtletí posunete čas. Změny trvají a voliči soudí výsledky. V grafu vlivů uvidíte, co čím hýbe."
ui.client.welcome_politics: "Vítejte. Vedete stranu ve vládě, která musí držet většinu: partneři mají požadavky a červené linie, hlasovat se o zákonech nebude. V záložce Politika sledujte průzkumy a loajalitu koalice, v záložce Politiky měňte nastavení (platí se zpožděním a každá změna stojí politický kapitál) a tlačítkem Ukončit čtvrtletí posouváte čas. Po volbách se sestavuje vláda, a pokud ji nevedete, jste v opozici a pracujete přes záložku Vaše strana."
