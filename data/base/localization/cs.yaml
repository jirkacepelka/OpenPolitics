name.base:mobility_up: "Příjmový vzestup"
desc.base:mobility_up: "Procento domácností, které za rok postoupí o příjmovou třídu výš. Zvyšuje ho růst, práce a vzdělání."
name.base:mobility_down: "Příjmový pád"
desc.base:mobility_down: "Procento domácností, které za rok klesnou o příjmovou třídu níž. Zvyšuje ho nezaměstnanost a nerovnost."
name.base:urban_share: "Obyvatelé měst"
desc.base:urban_share: "Podíl lidí žijících ve městech."
name.base:pension_participation: "Spoření na soukromou penzi"
desc.base:pension_participation: "Podíl pracujících, kteří si spoří na stáří."
name.base:pension_fund: "Soukromé penzijní fondy"
desc.base:pension_fund: "Majetek, který pro důchodce a pracující spravují soukromé penzijní fondy. Je to jejich bohatství a zároveň část kapitálu země, ze kterého se počítá majetková a daň z nemovitostí."
name.base:pension_saving: "Čisté spoření penzijních fondů"
desc.base:pension_saving: "Co fondy přijmou minus co vyplatí za rok. Mění se v investice."
name.base:pension_burden: "Státní důchody k zaplacení"
desc.base:pension_burden: "Podíl důchodců, které musí zaplatit stát, po odečtení části, kterou nahradí soukromé fondy."
name.base:pension_funded_share: "Důchody z privátních fondů"
desc.base:pension_funded_share: "Podíl důchodového účtu, který platí soukromé fondy."
name.base:core_inflation: "Základní inflace"
desc.base:core_inflation: "Stálé tempo růstu cen. Daně a pravidla k němu přidávají jednorázové skoky cen."
name.base:working_class: "Domácnosti s nižším příjmem"
desc.base:working_class: "Zaměstnanci se skromnými příjmy."
name.base:upper_middle: "Vyšší střední třída"
desc.base:upper_middle: "Dobře placení odborníci."
name.base:families: "Rodiny s dětmi"
