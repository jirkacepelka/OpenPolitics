ui.prompt: "What do you do? (Enter = next quarter, ? = help)"
ui.help.body: "Enter            end the quarter and see what happens\nset N VALUE      change policy number N, e.g.  set 1 26   (takes a few quarters; costs political capital)\nlist             show your policies         voters   show how each group of voters feels\nvalues           list everything the country measures\nwhy NAME         explain what pushed a value last quarter, e.g.  why unemployment\ninfo NAME        explain a policy or value in plain words\nsave FILE / load FILE    keep or resume a game\nquit             leave the game\nNAME can be a number, the start of its name, or its id.\nSpending can follow GDP, inflation or nothing: index N gdp|inflation|none\nPropose a policy (not as leader): propose POLICY VALUE (a partner's goes to the leader, otherwise public; 'announce' is the same)\nIn government: leave  dismiss PARTY  reshuffle drop PARTY add PARTY (leader)  confidence (opposition)\nGovernment formation: coalition  auto  invite PARTY  agree PARTY N  submit  accept  reject  early\nPriorities and promises: priority POLICY WEIGHT   promise N (before an election: what you will do in the next term, judged at the election after it)\nProposals put to you: support / oppose the open proposal\nUltimatum (junior partner): ultimatum [check] demand N [QUARTERS] or ultimatum [check] policy POLICY [QUARTERS]; withdraw\nCoalition talks (formateur): offer  offer send  offer counter  counter PARTY N VALUE|half|off  portfolio PARTY PORTFOLIO  concede PARTY 0-2; invited: counter N [PORTFOLIO]"
