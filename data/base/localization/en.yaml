desc.base:urban: "People living in cities."
name.base:unemployed: "Unemployed"
desc.base:unemployed: "People looking for work."
name.base:entrepreneurs: "Entrepreneurs"
desc.base:entrepreneurs: "Business owners and the self-employed."
name.base:public_sector: "Public sector workers"
desc.base:public_sector: "Teachers, nurses, civil servants."
name.base:pension_subsidy: "Private pension: state contribution"
desc.base:pension_subsidy: "The state tops up what people save for their retirement (percent of GDP). More people save; the budget pays now, pensions are easier later."
name.base:pension_tax_relief: "Private pension: tax relief"
desc.base:pension_tax_relief: "Savings for retirement are deducted from taxes (revenue given up, percent of GDP). Makes saving worthwhile."
name.base:mandatory_pension_pillar: "Compulsory pension pillar"
desc.base:mandatory_pension_pillar: "A share of social contributions goes into private funds (percent of GDP). Strong long-run effect; for years the state loses the money and still pays today's pensioners."

