ui.cabinet.title: "Cabinet"
ui.cabinet.hint: "Partners hold ministries in proportion to their seats; the leader keeps the rest. A party that holds a ministry is heard more on its laws and stays more loyal. Hover a ministry to see its laws."

# --- Population and private pensions (decision 0021) ---
