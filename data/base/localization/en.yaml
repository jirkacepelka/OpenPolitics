ui.explain.ultimatum: "As a junior partner you can tell the leader: deliver this or we leave. Pick one of your demands (a value goal is asked as a move of the policy that drives it most) or a programme position (at most {4} of the policy's range toward it) and a deadline of {1}-{2} quarters. It costs {0} capital; one at a time, then a pause of {3} quarters. The leader answers at the end of the quarter: it gives in, stalls (it may still give in as the deadline nears) or refuses. It weighs the relation, how close the change is to its own platform, whether it can govern or find a replacement without you, your weight in the government, the size of the change and any grudge. Delivered: +{5} credibility and warmth among your voters, the leader likes you a little less. Undelivered at the deadline: your party leaves the government ({6} credibility instead of the {8} for leaving unannounced; the leader resents it; without your seats the government may fall). Withdrawing costs {7} credibility."
