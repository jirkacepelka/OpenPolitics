name.base:fertility: "Births per woman"
desc.base:fertility: "Children born per woman. Family support, childcare and housing raise it; insecurity lowers it."
name.base:life_expectancy: "Life expectancy"
desc.base:life_expectancy: "Years a newborn can expect to live. Health care and a clean environment raise it."
name.base:net_migration: "Net migration (per 1000)"
desc.base:net_migration: "People arriving minus leaving, per 1000 inhabitants a year."
name.base:mobility_up: "Moving up the income ladder"
desc.base:mobility_up: "Percent of households that move up an income class a year. Growth, jobs and education raise it."
name.base:mobility_down: "Sliding down the income ladder"
desc.base:mobility_down: "Percent of households that fall an income class a year. Unemployment and inequality raise it."
name.base:urban_share: "Living in cities"
desc.base:urban_share: "Share of the people living in cities."
name.base:pension_participation: "Saving for a private pension"
desc.base:pension_participation: "Share of the workers who save privately for old age."
name.base:pension_fund: "Private pension funds"
desc.base:pension_fund: "Assets the private pension funds hold for retirees and workers. It is their wealth and part of the country's capital, which a property or wealth tax is levied on."
name.base:pension_saving: "Net saving of the pension funds"
desc.base:pension_saving: "What the funds take in minus what they pay out, a year. It becomes investment."
name.base:pension_burden: "State pensions to pay"
desc.base:pension_burden: "The share of pensioners the state has to pay for, less what the private funds replace."
name.base:pension_funded_share: "Pensions paid by private funds"
desc.base:pension_funded_share: "Share of the pension bill the private funds pay."
name.base:core_inflation: "Underlying inflation"
desc.base:core_inflation: "The steady pace of price growth. Taxes and rules add one-off jumps to prices on top of it."
