desc.base:defence: "Extra defence spending, yearly amount (on top of the baseline in Administration). Small security and technology spillovers."
desc.base:culture_sport: "Theatres, museums and sports clubs, yearly amount. Healthier, better educated people."
desc.base:public_transport: "Subsidies for trains, trams and buses, yearly amount. Cleaner air, easier commuting."
desc.base:housing_support: "Rent allowances and municipal flats, yearly amount. Cuts inequality."
desc.base:family_allowances: "Cash for families with children, yearly amount. Fewer poor families, a slightly larger workforce later."
desc.base:active_labour_policy: "Retraining and job placement, yearly amount. Brings unemployment down."
desc.base:rural_development: "Support for villages and farms, yearly amount. Jobs and fairness outside the cities."
desc.base:green_subsidies: "Insulation, solar panels and clean industry, yearly amount. Improves the environment; pushes prices up a little."
desc.base:digital_infrastructure: "Fast internet and online public services, yearly amount. Raises productivity in the long run."
desc.base:childcare: "Nurseries and kindergartens, yearly amount. Parents can work; children learn earlier."
desc.base:property_tax: "Tax on land and buildings, as a tax rate. Hard to avoid, mildly reduces inequality."
desc.base:carbon_tax: "Tax on emissions, as a tax rate. Cleaner nature, higher prices, a drag on industry."
desc.base:wealth_tax: "Tax on large fortunes, as a tax rate. Cuts inequality but chases capital away."
desc.base:transaction_tax: "Tiny tax on trading, as a tax rate. Raises money; investors dislike it."
desc.base:excise_taxes: "Extra duties on tobacco, alcohol and sugar, as a tax rate. Healthier people, higher prices."
desc.base:minimum_wage: "How high the legal minimum wage is (0 to 10). Helps the poorest; can cost jobs and raises prices."
desc.base:labour_flexibility: "How easy it is to hire and fire (0 to 10). More jobs and productivity, less security."
desc.base:rent_control: "How strictly rents are capped (0 to 10). Protects tenants, discourages building."
desc.base:drug_policy: "How liberal drug laws are (0 to 10). Frees up courts and helps addicts, but crime can tick up."
desc.base:university_fees: "How high tuition fees are (0 to 10). Saves public money; keeps poorer students out."
desc.base:retirement_age: "The age people retire at (years). Later retirement means more workers and a tougher old age."
desc.base:energy_mix: "How green the power supply is (0 to 10). Cleaner air, pricier energy."
desc.base:business_regulation: "How much red tape firms face (0 to 10). Protects consumers and workers; slows investment."
desc.base:surveillance: "How much the state may watch its citizens (0 to 10). Fewer crimes solved the hard way, fewer freedoms."

