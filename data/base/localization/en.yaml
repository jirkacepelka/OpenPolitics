ui.explain.negotiation: "Each party asks a price for joining: its own price, lowered by a good relation, raised by a grudge, and multiplied by how far apart you are (talk distance from the programmes and the compass; ×{0} per unit away from the usual), by its strength against yours and by whether it could form another majority without you. From a talk distance of {1} it refuses whatever you offer. A demand you agree pays its weight; a negotiable demand (your programme pulls the other way) can be offered half-way for part of it; a cabinet portfolio pays its value, more if the party cares about its policies (at most {7} per party); a concession costs you {2} capital and pays {3} (at most {4} per party). Red lines, grudges and contradictions block. You have {5} offers a quarter; a party that refuses an offer loses {6} relation. Parties that hold a portfolio are more loyal and are heard more on its policies."
