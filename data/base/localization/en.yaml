desc.base:gdp: "Total value of everything produced in a year. Bigger means a richer country."
desc.base:capital: "Machines, buildings and networks that firms use. Built up by investment, worn down over time."
desc.base:productivity: "How much each worker and machine produces. Education, research and good infrastructure raise it."
desc.base:labour_force: "People who work or look for work."
desc.base:unemployment: "Share of the labour force without a job. Voters hate it."
desc.base:inflation: "How fast prices rise per year. Moderate is fine, high hurts savers and pensioners."
desc.base:debt: "What the state owes. Interest on it eats the budget, and lenders charge more when it is high."
desc.base:interest_rate: "What the state pays to borrow. Rises with debt."
desc.base:revenue: "Taxes and contributions the state collects per year."
desc.base:spending: "What the state spends per year on pensions, health, schools and more."
desc.base:price_level: "Index of consumer prices, 100 at the start. Rises with inflation."
desc.base:gdp_nominal: "GDP in current prices: real GDP times the price level."
desc.base:real_growth: "How fast the economy grows per year after removing inflation."
desc.base:deficit_pct: "Spending plus interest minus revenue as a share of GDP. Negative means a surplus."
desc.base:health: "Overall health of the population."
desc.base:education_level: "How well educated people are. Builds up slowly."
desc.base:crime: "Registered crimes per 100,000 people per year."
desc.base:environment: "Quality of air, water and nature. Growth tends to hurt it, regulation helps."
desc.base:inequality: "How unevenly income is spread (Gini index, higher means more unequal)."
desc.base:income_tax: "Income tax and social contributions, as a tax rate. More money for the state, but it weighs on work and growth."
desc.base:vat: "VAT and excise duties, as a tax rate. Easy to collect; pushes prices up and hits low earners."
desc.base:corporate_tax: "Tax on company profits, as a tax rate. Too high scares off investment."
desc.base:pensions: "Pension spending, yearly amount. Seniors love it; it costs a lot."
desc.base:health_spending: "Hospitals and doctors, yearly amount. Improves health."
desc.base:education_spending: "Schools and universities, yearly amount. Pays off slowly through productivity."
desc.base:police: "Police and courts, yearly amount. Lowers crime."
desc.base:research: "Public research funding, yearly amount. Boosts productivity over the years."
desc.base:social_benefits: "Unemployment and family benefits, yearly amount. Reduces inequality and crime, but can discourage work."
desc.base:infrastructure: "Roads, rail and networks, yearly amount. Slow to build, lasting benefit."
desc.base:administration: "Running the state (offices, defence), yearly amount. Cutting it saves money, but you cannot cut it to zero."
desc.base:environment_regulation: "How strict environmental rules are (0 to 10). Cleans up nature, costs firms money."
desc.base:migration: "How open the country is to migration (0 to 10). Adds workers, divides opinion."
ui.unit.gdp_share: "% of GDP"

