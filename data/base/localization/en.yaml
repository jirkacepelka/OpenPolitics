ui.explain.capital: "Political capital pays for your party's actions and, for the leader of the government, for policy changes. Income per quarter: {0} + {1} × organisation × poll share, +{2} for the leader of a sitting government, and up to ±{3} from the coalition (leader: the partners' mean loyalty; partner: your relation with the leader). It cannot exceed {4}."
ui.explain.organisation: "How well your party is organised (0–100 %). It raises your capital income ({0} × organisation × poll share each quarter) and the turnout of your voters (up to +{1} % at full organisation). Organise: +{2} points for {3} capital. It falls by {4} point every quarter."
ui.explain.credibility: "How much voters trust your programme (0–100 %). With cohesion it scales how strongly your positions attract voters (half of that appeal depends on it). It recovers by {0} points a year. It falls when you shift a position (up to {1} points for a shift over the whole range), change a priority, break a promise while governing (−{2}), leave a coalition (−{3}), lose a no-confidence vote, answer or announce against your programme, or gain fiscal blame. A promise kept while governing gives +{4}."
ui.explain.cohesion: "How united your factions are behind the platform (0–100 %): one minus their average distance from it. Voters see credibility × cohesion, so a split party attracts less. It changes only when you shift positions your factions care about."
ui.explain.relations: "How other parties see you (0–1, neutral {0}). Good relations lower the price a party asks in coalition talks (by up to half), make you a likelier partner, help your proposals with the leader, decide who backs your no-confidence vote (from 0.4) and, as a partner, bring up to ±{1} capital a quarter. Court: +{2} for {3} capital. Relations drift back toward {0} by {4} a quarter."
ui.explain.fiscal_blame: "How much voters blame your party for the deficit. It is measured from the start of this government, and only when the budget goes into deficit above the level the government inherited (a surplus counts as zero): for every point the deficit rises above that level, the leader gains {0} point of blame and each partner {1}, times a severity of 1 + deficit / {7} (at most {8}) - so pushing an already high deficit higher weighs much more. Nothing is gained in surplus, at or below the inherited deficit, or while the deficit falls. While it falls or stays at or below the inherited level, the government's parties shed blame (at least {6} points a quarter for the leader at or below that level). Blame halves every {2} quarters. Each point costs your voters' warmth ({3} in the poll, at most {4}) and, when gained, {5} credibility. In opposition you neither gain nor shed it: the party that ran up a deficit keeps paying, the one that cleans it up carries none."
ui.explain.campaign: "Campaign: {0} capital per level (1–3). The chosen voter group warms to you by {1} per level, twice as much in the last {2} quarters before an election. Warmth halves every {3} quarters."
ui.explain.organise: "Organise: {0} capital for +{1} points of organisation (more capital income and turnout; organisation falls by {2} point a quarter)."
ui.explain.court: "Court a party: {0} capital, relation +{1} (it drifts back toward the neutral value)."
ui.explain.criticize: "Criticise (not as leader): {0} capital. Groups that care about the value and saw it get worse over the last four quarters warm to you (+{1}) and blame the government (pressure +{2}); if it got better, it backfires (−{3})."
ui.explain.stance: "Stance on a government measure (not as leader): {0} capital; each group that likes your stance warms by up to {1} (scaled by its size), the others cool."
ui.explain.promise: "Promise (in the last {0} quarters before an election, at most {1} per election): {2} capital; your voter groups warm by up to {3}. It says what you will do in the next term and is judged at the election that ends that term: if you governed at least half of it, kept +{4} credibility, broken −{5}; otherwise nothing."
ui.explain.priority: "Priority: free, ±{1} weight at a time; credibility falls by {2} × the change. A higher weight makes the position count more with voters and in coalition talks."
ui.explain.shift: "Shift a position: free, at most {1} % of the range at a time; credibility falls by {2} × the shift relative to the range."
ui.explain.propose: "Propose a policy (not as leader), one a quarter. As a partner: {0} capital, and the leader answers at the end of the quarter (by your relation, your share of the government's seats and how well it fits its platform). Outside the government: {1} capital and it goes public (the same policy again after {2} quarters; an AI-led government adopts a popular one with a chance of {3} %). Either way the groups that would like it warm to you by up to {4}, the others cool, and going against your programme costs up to {5} credibility."
ui.explain.proposals: "Proposals in the briefing: free. Answering in line with your programme earns up to {0} credibility, against it costs up to {1}; support +{2} relation with the proposer, oppose −{3} (a partner opposing its own government −{4} more); voter groups react by up to {5}. A pivotal partner's no blocks a measure (relation −{6}). At most one every {7} quarters; unanswered, a measure passes and a request lapses."
ui.explain.reshuffle: "Reshuffle the coalition (leader): {0} + {1} capital per party dropped or added; the next one after {2} quarters ({3} after a refusal)."
ui.explain.exits: "No confidence (opposition): {0} capital; it passes with enough willing parties (relation 0.4 or more) and unhappy partners. Dismiss a partner (leader): {1} capital, if the rest keep a majority. Leave the coalition (partner): free, −{2} credibility."
ui.help.proposal: "Answer with: support  or  oppose  (free; before you end the quarter)"
