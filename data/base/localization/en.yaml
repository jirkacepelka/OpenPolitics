ui.alliance.title: "Electoral alliance"
ui.alliance.hint: "Parties can run one joint list with a joint programme. It helps small parties: in the districts it ends the splitting of votes, and in a proportional count it lifts two parties over the threshold together, but the list needs a higher one (x1.6 for two parties, x2.2 for three). The farther the joint programme is from a party's own, the more of its voters stay at home."
