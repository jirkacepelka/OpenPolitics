# ILLUSTRATIVE data: wave-5 taxes. They start at 0: nothing extra is levied until you choose to.
- id: base:inheritance_tax
  capital_cost: 1   # political capital weight of a change (decision 0013)
  unit: tax_rate
  min: 0
  max: 1
  default: 0
  delay_turns: 1
  revenue_base: base:gdp   # parameter = revenue as percent of GDP
  base_share: 0.8   # share of GDP the tax is levied on; rate shown = revenue% / base_share
  axis_x: -0.7
