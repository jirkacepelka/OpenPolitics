  max: 1
  default: 0
  delay_turns: 1
  revenue_base: base:capital   # parameter = revenue as percent of the capital stock (houses, land, firms, pension funds)
  base_share: 0.667   # share of the capital that is real estate; rate shown = revenue% / base_share
  axis_x: -0.6
