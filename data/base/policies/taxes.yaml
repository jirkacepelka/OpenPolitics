# ILLUSTRATIVE data: approximate numbers for a Czechia-like country around 2015, not statistics.
- id: base:income_tax
  unit: tax_rate
  min: 8
  max: 45
  default: 24
  delay_turns: 1
  revenue_base: base:gdp   # parameter = revenue as percent of GDP
  base_share: 0.6   # share of GDP the tax is levied on; rate shown = revenue% / base_share
  axis_x: -1
