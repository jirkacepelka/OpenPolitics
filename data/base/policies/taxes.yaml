# ILLUSTRATIVE data: approximate numbers for a Czechia-like country around 2015, not statistics.
- id: base:income_tax
  abolishable: false
  capital_cost: 2   # political capital weight of a change (decision 0013)
  unit: tax_rate
  min: 8
  max: 45
  default: 24
  delay_turns: 1
  revenue_base: base:gdp   # parameter = revenue as percent of GDP
  base_share: 0.6   # share of GDP the tax is levied on; rate shown = revenue% / base_share
  axis_x: -1
- id: base:vat
  abolishable: false
  capital_cost: 1.5   # political capital weight of a change (decision 0013)
  unit: tax_rate
  min: 4
  max: 24
  default: 12
  delay_turns: 1
  revenue_base: base:gdp   # parameter = revenue as percent of GDP
  base_share: 0.57   # share of GDP the tax is levied on; rate shown = revenue% / base_share
  axis_x: -0.4
