# ILLUSTRATIVE data: approximate numbers for a Czechia-like country around 2015, not statistics.
- id: base:recession
  condition: "base:gdp > 0"
  probability: 0.008          # about 3 percent per year
  text_key: event.recession
  effects:
    - {value: base:unemployment, delta: 2.0}
    - {value: base:inflation, delta: -0.5}
- id: base:energy_shock
  condition: "base:gdp > 0"
  probability: 0.01
  text_key: event.energy_shock
  effects:
    - {value: base:inflation, delta: 1.5}
    - {value: base:unemployment, delta: 0.3}
- id: base:tech_boom
  condition: "base:education_level > 60"
  probability: 0.01
  text_key: event.tech_boom
  effects:
    - {value: base:productivity, delta: 50.9918}    # about +1 percent
- id: base:health_crisis
  condition: "base:health < 85"
  probability: 0.005
  text_key: event.health_crisis
  effects:
    - {value: base:health, delta: -6.0}
    - {value: base:unemployment, delta: 0.5}
- id: base:crime_wave
  condition: "base:unemployment > 7 and base:inequality > 27"
  probability: 0.1
  text_key: event.crime_wave
  effects:
    - {value: base:crime, delta: 200.0}

# ILLUSTRATIVE data: wave 4 events (shocks and booms). Effects are one-off changes of values.
- id: base:banking_crisis
  condition: "base:debt > 0"
  probability: 0.004
  text_key: event.banking_crisis
  effects:
    - {value: base:capital, delta: -400000000000}
    - {value: base:unemployment, delta: 1.5}
- id: base:export_boom
  condition: "base:real_growth > 0"
  probability: 0.01
  text_key: event.export_boom
  effects:
    - {value: base:gdp, delta: 46000000000}
    - {value: base:unemployment, delta: -0.3}
- id: base:pandemic
  condition: "base:gdp > 0"
  probability: 0.003
  text_key: event.pandemic
  effects:
    - {value: base:health, delta: -8}
    - {value: base:unemployment, delta: 1.5}
    - {value: base:gdp, delta: -92000000000}
- id: base:flood
  condition: "base:gdp > 0"
  probability: 0.008
  text_key: event.flood
  effects:
    - {value: base:capital, delta: -70000000000}
    - {value: base:environment, delta: -3}
    - {value: base:gdp, delta: -23000000000}
- id: base:drought
  condition: "base:environment < 90"
  probability: 0.01
  text_key: event.drought
  effects:
    - {value: base:environment, delta: -2}
    - {value: base:inflation, delta: 0.4}
- id: base:migration_wave
  condition: "base:gdp > 0"
  probability: 0.006
  text_key: event.migration_wave
  effects:
    - {value: base:labour_force, delta: 30000}
    - {value: base:unemployment, delta: 0.2}
    - {value: base:inequality, delta: 0.3}
- id: base:brain_drain
  condition: "base:unemployment > 7"
  probability: 0.01
  text_key: event.brain_drain
  effects:
    - {value: base:labour_force, delta: -20000}
    - {value: base:productivity, delta: -20}
- id: base:general_strike
  condition: "base:inequality > 28"
  probability: 0.015
  text_key: event.general_strike
  effects:
    - {value: base:gdp, delta: -23000000000}
    - {value: base:unemployment, delta: 0.3}
- id: base:tech_hub
  condition: "base:education_level > 55"
  probability: 0.008
  text_key: event.tech_hub
  effects:
    - {value: base:productivity, delta: 30}
    - {value: base:capital, delta: 100000000000}
- id: base:foreign_investment
  condition: "base:interest_rate < 4"
  probability: 0.01
  text_key: event.foreign_investment
  effects:
    - {value: base:capital, delta: 200000000000}
    - {value: base:unemployment, delta: -0.2}
- id: base:oil_price_drop
  condition: "base:inflation > 1"
  probability: 0.01
